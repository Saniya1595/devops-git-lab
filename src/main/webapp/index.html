<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fb; margin: 0; }
        .container { max-width: 760px; margin: 50px auto; background: white; padding: 36px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
        h1 { margin-top: 0; }
        input, textarea { width: 100%; box-sizing: border-box; padding: 12px; margin: 8px 0 18px; border: 1px solid #ccc; border-radius: 8px; }
        button { padding: 12px 18px; border: 0; border-radius: 8px; cursor: pointer; }
        .links { margin-top: 24px; }
        .links a { margin-right: 16px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Student Feedback Portal</h1>
    <p>DevOps Internship Project: Java + Maven + Jenkins + Tomcat</p>

    <form action="feedback" method="post">
        <label>Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Feedback</label>
        <textarea name="feedback" rows="5" required></textarea>

        <button type="submit">Submit Feedback</button>
    </form>

    <div class="links">
        <a href="health">Health Check</a>
    </div>
</div>
</body>
</html>
